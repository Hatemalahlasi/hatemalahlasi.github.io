<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hatem Al-Ahlasi | حاتم الأحلسي</title>
    <meta name="description" content="أبني الأنظمة التي يديرها الآخرون، وأصمم الرؤية التي يقلدها الجميع. مهندس شبكات، مطور أتمتة، ومصمم رقمي.">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .avatar {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            margin-bottom: 18px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .bio {
            color: #cbd5e1;
            font-size: 14.5px;
            line-height: 1.6;
            margin-bottom: 28px;
            padding: 0 10px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            background: rgba(51, 65, 85, 0.6);
            color: #f8fafc;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s ease;
            display: block;
        }
        .btn:hover, .btn:active {
            background: #0284c7;
            border-color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(2, 132, 199, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="رابط_صورتك_الشخصية" alt="Hatem Al-Ahlasi" class="avatar">
        
        <h1>Hatem Al-Ahlasi | حاتم الأحلسي</h1>
        <p class="bio">أبني الأنظمة التي يديرها الآخرون، وأصمم الرؤية التي يقلدها الجميع.<br>مهندس شبكات • مطور أتمتة • مصمم رقمي</p>

        <div class="links">
            <a href="رابط_فيسبوك" class="btn" target="_blank">Facebook | فيسبوك</a>
            <a href="رابط_إنستغرام" class="btn" target="_blank">Instagram | إنستغرام</a>
            <a href="رابط_يوتيوب" class="btn" target="_blank">YouTube | يوتيوب</a>
            <a href="رابط_تيليجرام" class="btn" target="_blank">Telegram | تيليجرام</a>
            <a href="رابط_تيك_توك" class="btn" target="_blank">TikTok | تيك توك</a>
            <a href="رابط_سناب_شات" class="btn" target="_blank">Snapchat | سناب شات</a>
            <a href="رابط_إكس_تويتر" class="btn" target="_blank">X (Twitter) | إكس</a>
            <a href="رابط_جيت_هب" class="btn" target="_blank">GitHub | جيت هب</a>
        </div>
    </div>

</body>
</html>
