<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hatem Al-Ahlasi | بوابة النظام</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0807;
            --card-bg: rgba(20, 16, 14, 0.85);
            --accent-gold: #d4af37;
            --accent-bronze: #b8860b;
            --text-main: #fcf8f2;
            --text-muted: #b5aba1;
            --border-glass: rgba(212, 175, 55, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(184, 134, 11, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.12) 0%, transparent 45%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 40px 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.85);
            position: relative;
            overflow: hidden;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #f6d879;
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 22px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-gold);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-gold);
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 8px;
            text-align: center;
        }

        .name-en {
            font-family: 'JetBrains Mono', sans-serif;
            font-size: 12px;
            color: var(--accent-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-portal {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-bronze));
            color: #0a0807;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-portal:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .link-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(25, 20, 16, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 14px;
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-main);
            transition: 0.3s;
        }

        .link-card:hover {
            border-color: var(--accent-gold);
            background: rgba(35, 28, 22, 0.9);
        }

        .link-card.full {
            grid-column: span 2;
            justify-content: center;
        }

        /* نافذة تسجيل الدخول المنبثقة (Modal) */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: #14100e;
            border: 1px solid var(--accent-gold);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: right;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
        }

        .form-group input:focus {
            border-color: var(--accent-gold);
            outline: none;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            float: left;
        }
    </style>
</head>
<body>

    <main class="container">
        <div style="text-align: center;">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>SYSTEM ONLINE • حاتم الأحلسي</span>
            </div>
            <div class="name-en">HATEM AL-AHLASI</div>
            <h1>بوابة الخدمات والشبكات</h1>
        </div>

        <!-- زر الدخول للبوابة -->
        <button class="btn-portal" onclick="openPortal()">
            <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول / لوحة التحكم
        </button>

        <div class="links-grid" style="margin-top: 25px;">
            <a href="https://t.me/hatemalahlasi" class="link-card" target="_blank">
                <i class="fa-brands fa-telegram" style="color: #26A5E4; font-size: 18px;"></i>
                <span>تيليجرام</span>
            </a>
            <a href="https://www.instagram.com/hatem.ym" class="link-card" target="_blank">
                <i class="fa-brands fa-instagram" style="color: #E4405F; font-size: 18px;"></i>
                <span>إنستغرام</span>
            </a>
            <a href="https://github.com/Hatemalahlasi" class="link-card full" target="_blank">
                <i class="fa-brands fa-github" style="color: var(--accent-gold); font-size: 18px;"></i>
                <span>مستودع المشاريع على جيت هب</span>
            </a>
        </div>
    </main>

    <!-- نافذة النظام الديناميكية -->
    <div id="portalModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closePortal()">&times;</button>
            <div id="modalBody">
                <!-- يتم حقن المحتوى هنا برمجياً -->
            </div>
        </div>
    </div>

    <script>
        function openPortal() {
            document.getElementById('portalModal').style.display = 'flex';
            showLoginScreen();
        }

        function closePortal() {
            document.getElementById('portalModal').style.display = 'none';
        }

        function showLoginScreen() {
            document.getElementById('modalBody').innerHTML = `
                <h3 style="color: var(--accent-gold); margin-bottom: 15px;">تسجيل الدخول للنظام</h3>
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="loginUser" placeholder="أدخل اسم المستخدم">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPass" placeholder="أدخل كلمة المرور">
                </div>
                <button class="btn-portal" onclick="handleLogin()">دخول</button>
                <p style="text-align: center; margin-top: 15px; font-size: 13px; color: var(--text-muted);">
                    ليس لديك حساب؟ <a href="#" onclick="showRegisterScreen()" style="color: var(--accent-gold);">إنشاء حساب جديد</a>
                </p>
            `;
        }

        function showRegisterScreen() {
            document.getElementById('modalBody').innerHTML = `
                <h3 style="color: var(--accent-gold); margin-bottom: 15px;">تسجيل مستخدم جديد</h3>
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="regUser" placeholder="اختر اسم مستخدم">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="regPass" placeholder="اختر كلمة مرور">
                </div>
                <button class="btn-portal" onclick="handleRegister()">حفظ وإنشاء الحساب</button>
                <p style="text-align: center; margin-top: 15px; font-size: 13px; color: var(--text-muted);">
                    لديك حساب بالفعل؟ <a href="#" onclick="showLoginScreen()" style="color: var(--accent-gold);">تسجيل الدخول</a>
                </p>
            `;
        }

        function handleRegister() {
            let user = document.getElementById('regUser').value.trim();
            let pass = document.getElementById('regPass').value.trim();
            if(!user || !pass) {
                alert('الرجاء إدخال اسم المستخدم وكلمة المرور');
                return;
            }
            let users = JSON.parse(localStorage.getItem('hatem_users') || '[]');
            if(users.some(u => u.user === user)) {
                alert('اسم المستخدم موجود مسبقاً!');
                return;
            }
            users.push({user, pass, data: 'بيانات افتراضية خاصة بالمستخدم'});
            localStorage.setItem('hatem_users', JSON.stringify(users));
            alert('تم إنشاء الحساب بنجاح! سجل دخولك الآن.');
            showLoginScreen();
        }

        function handleLogin() {
            let user = document.getElementById('loginUser').value.trim();
            let pass = document.getElementById('loginPass').value.trim();
            
            // حساب المشرف العام الخاص بك
            if(user === 'hatem' && pass === '12345') {
                showAdminDashboard();
                return;
            }

            let users = JSON.parse(localStorage.getItem('hatem_users') || '[]');
            let found = users.find(u => u.user === user && u.pass === pass);
            if(found) {
                showUserDashboard(found);
            } else {
                alert('اسم المستخدم أو كلمة المرور غير صحيحة');
            }
        }

        function showUserDashboard(currentUser) {
            document.getElementById('modalBody').innerHTML = `
                <h3 style="color: var(--accent-gold); margin-bottom: 10px;">لوحة تحكم المستخدم: ${currentUser.user}</h3>
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px;">أهلاً بك، هذه بياناتك الخاصة:</p>
                <div style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; margin-bottom: 15px;">
                    بياناتك المخزنة: <b>${currentUser.data}</b>
                </div>
                <button class="btn-portal" onclick="showLoginScreen()" style="background: #333; color: #fff;">تسجيل الخروج</button>
            `;
        }

        function showAdminDashboard() {
            let users = JSON.parse(localStorage.getItem('hatem_users') || '[]');
            let html = `
                <h3 style="color: var(--accent-gold); margin-bottom: 10px;">لوحة تحكم المشرف (Admin)</h3>
                <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 15px;">تستطيع هنا رؤية جميع المستخدمين:</p>
                <div style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;">
            `;
            if(users.length === 0) {
                html += `<p style="color: var(--text-muted); text-align:center;">لا توجد حسابات مسجلة بعد.</p>`;
            } else {
                users.forEach((u, index) => {
                    html += `<div style="background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; display:flex; justify-content:space-between; align-items:center;">
                        <span><b>${u.user}</b> (الكلمة: ${u.pass})</span>
                        <button onclick="deleteUser(${index})" style="background:#a00; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">حذف</button>
                    </div>`;
                });
            }
            html += `</div>
                <button class="btn-portal" onclick="showLoginScreen()" style="background: #333; color: #fff;">تسجيل الخروج</button>
            `;
            document.getElementById('modalBody').innerHTML = html;
        }

        function deleteUser(index) {
            let users = JSON.parse(localStorage.getItem('hatem_users') || '[]');
            users.splice(index, 1);
            localStorage.setItem('hatem_users', JSON.stringify(users));
            showAdminDashboard();
        }
    </script>
</body>
</html>
