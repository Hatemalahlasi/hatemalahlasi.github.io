<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حاتم الاحلسي | الملف الشخصي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-page: #070d19;
            --bg-card: rgba(22, 33, 54, 0.72);
            --accent-blue: #0ea5e9;
            --accent-cyan: #38bdf8;
            --border-color: rgba(255, 255, 255, 0.09);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(14, 165, 233, 0.16), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(56, 189, 248, 0.12), transparent 45%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
        }

        .profile-container {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 36px 24px 28px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .profile-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* إطار الصورة الشخصية */
        .avatar-wrapper {
            position: relative;
            width: 112px;
            height: 112px;
            margin: 0 auto 18px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--accent-cyan), #3b82f6, #0f172a);
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.35);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            border: 3px solid #0f172a;
            background-color: #1e293b;
        }

        .status-dot {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 16px;
            height: 16px;
            background-color: #10b981;
            border: 3px solid #0f172a;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.7);
        }

        .name-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 23px;
            font-weight: 800;
            color: var(--text-light);
            letter-spacing: -0.3px;
        }

        .verified-badge {
            color: var(--accent-cyan);
            font-size: 17px;
        }

        .role-tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-cyan);
            background: rgba(14, 165, 233, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 14px;
        }

        .bio-text {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.65;
            padding: 0 6px;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 16px;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-light);
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .social-btn:hover, .social-btn:active {
            transform: translateY(-2px);
            background: rgba(30, 41, 59, 0.9);
            border-color: var(--btn-color, var(--accent-blue));
            box-shadow: 0 8px 20px -6px var(--btn-glow, rgba(14, 165, 233, 0.35));
        }

        .social-btn .right-side {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .icon-box {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.25s ease;
        }

        .social-btn:hover .icon-box {
            transform: scale(1.08);
        }

        .link-info {
            text-align: right;
            display: flex;
            flex-direction: column;
        }

        .link-title {
            font-weight: 700;
            font-size: 14.5px;
            line-height: 1.3;
        }

        .link-handle {
            font-size: 11.5px;
            color: var(--text-muted);
            direction: ltr;
            text-align: right;
        }

        .arrow-icon {
            font-size: 12px;
            color: var(--text-muted);
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .social-btn:hover .arrow-icon {
            transform: translateX(-4px);
            color: var(--text-light);
        }

        /* ألوان كل منصة */
        .btn-telegram { --btn-color: #229ED9; --btn-glow: rgba(34, 158, 217, 0.35); }
        .btn-telegram .icon-box { color: #229ED9; background: rgba(34, 158, 217, 0.12); }

        .btn-instagram { --btn-color: #E4405F; --btn-glow: rgba(228, 64, 95, 0.35); }
        .btn-instagram .icon-box { color: #E4405F; background: rgba(228, 64, 95, 0.12); }

        .btn-facebook { --btn-color: #1877F2; --btn-glow: rgba(24, 119, 242, 0.35); }
        .btn-facebook .icon-box { color: #1877F2; background: rgba(24, 119, 242, 0.12); }

        .btn-tiktok { --btn-color: #00f2fe; --btn-glow: rgba(0, 242, 254, 0.3); }
        .btn-tiktok .icon-box { color: #ffffff; background: rgba(255, 255, 255, 0.1); text-shadow: -1.5px 0 #00f2fe, 1.5px 0 #ff0050; }

        .btn-snapchat { --btn-color: #FFFC00; --btn-glow: rgba(255, 252, 0, 0.25); }
        .btn-snapchat .icon-box { color: #FFFC00; background: rgba(255, 252, 0, 0.12); }

        /* زر مشاركة الرابط */
        .share-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.18), rgba(2, 132, 199, 0.08));
            color: var(--accent-cyan);
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .share-btn:hover {
            background: rgba(14, 165, 233, 0.25);
            color: #ffffff;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 11.5px;
            color: var(--text-muted);
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- الصورة الشخصية -->
        <div class="avatar-wrapper">
            <img src="avatar.jpg" alt="حاتم الاحلسي" class="avatar-img" onerror="this.src='https://ui-avatars.com/api/?name=حاتم+الاحلسي&background=0284c7&color=fff&size=200&font-size=0.38'">
            <span class="status-dot" title="متاح للتواصل"></span>
        </div>
        
        <div class="name-row">
            <h1>حاتم الاحلسي</h1>
            <i class="fa-solid fa-circle-check verified-badge" title="حساب رسمي"></i>
        </div>
        <div class="role-tag">مهندس شبكات ونظم تقنية</div>

        <p class="bio-text">أطور حلول الويب وتطبيقات الإدارة السحابية وأنظمة الشبكات. يسعدني تواصلك معي عبر حساباتي الرسمية أدناه.</p>

        <div class="social-links">
            <!-- تليجرام -->
            <a href="https://t.me/hatemalahlasi" target="_blank" rel="noopener noreferrer" class="social-btn btn-telegram">
                <div class="right-side">
                    <div class="icon-box"><i class="fa-brands fa-telegram"></i></div>
                    <div class="link-info">
                        <span class="link-title">تليجرام</span>
                        <span class="link-handle">@hatemalahlasi</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <!-- انستقرام -->
            <a href="https://www.instagram.com/hatem.ym?srtk=MTlnbWpmd3AwNW12Mg%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" class="social-btn btn-instagram">
                <div class="right-side">
                    <div class="icon-box"><i class="fa-brands fa-instagram"></i></div>
                    <div class="link-info">
                        <span class="link-title">انستقرام</span>
                        <span class="link-handle">@hatem.ym</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <!-- فيسبوك -->
            <a href="https://www.facebook.com/share/1GwQNm6TV1/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="social-btn btn-facebook">
                <div class="right-side">
                    <div class="icon-box"><i class="fa-brands fa-facebook-f"></i></div>
                    <div class="link-info">
                        <span class="link-title">فيسبوك</span>
                        <span class="link-handle">حاتم الاحلسي</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <!-- تيك توك -->
            <a href="https://www.tiktok.com/@hatem.ym" target="_blank" rel="noopener noreferrer" class="social-btn btn-tiktok">
                <div class="right-side">
                    <div class="icon-box"><i class="fa-brands fa-tiktok"></i></div>
                    <div class="link-info">
                        <span class="link-title">تيك توك</span>
                        <span class="link-handle">@hatem.ym</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <!-- سناب شات -->
            <a href="https://snapchat.com/t/EagwKRp9" target="_blank" rel="noopener noreferrer" class="social-btn btn-snapchat">
                <div class="right-side">
                    <div class="icon-box"><i class="fa-brands fa-snapchat"></i></div>
                    <div class="link-info">
                        <span class="link-title">سناب شات</span>
                        <span class="link-handle">إضافة سريعة</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>
        </div>

        <!-- زر نسخ/مشاركة الصفحة -->
        <button class="share-btn" onclick="shareProfile()" id="shareBtn">
            <i class="fa-solid fa-share-nodes"></i>
            <span>مشاركة رابط الصفحة</span>
        </button>

        <div class="footer-note">
            جميع الحقوق محفوظة © 2026 حاتم الاحلسي
        </div>
    </div>

    <script>
        function shareProfile() {
            const shareData = {
                title: 'حاتم الاحلسي | الملف الشخصي',
                text: 'تواصل مع حاتم الاحلسي عبر الحسابات الرسمية:',
                url: window.location.href
            };

            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                const btn = document.getElementById('shareBtn');
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> <span>تم نسخ رابط الصفحة!</span>';
                setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
            }
        }
    </script>

</body>
</html>
