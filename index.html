<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حاتم الأحلصي | الملف الشخصي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-page: #0f172a;
            --bg-card: #1e293b;
            --accent-blue: #0284c7;
            --hover-blue: #0369a1;
            --border-color: #334155;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .profile-container {
            width: 100%;
            max-width: 450px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
        }

        .avatar-box {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #0284c7, #0f172a);
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 36px;
            border: 3px solid var(--accent-blue);
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--text-light);
        }

        .bio-text {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-light);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            border-color: var(--accent-blue);
            background: #111827;
            transform: translateY(-2px);
        }

        .social-btn .left-side {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .social-btn i {
            font-size: 18px;
            color: var(--accent-blue);
        }

        .social-btn .fa-telegram { color: #229ED9; }
        .social-btn .fa-instagram { color: #E4405F; }
        .social-btn .fa-facebook { color: #1877F2; }

        .footer-note {
            margin-top: 24px;
            font-size: 11.5px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="avatar-box">
            <i class="fa-solid fa-user-tie"></i>
        </div>
        
        <h1>حاتم الأحلصي</h1>
        <p class="bio-text">مهندس شبكات ونظم تقنية، أطور حلول الويب وتطبيقات الإدارة السحابية. مرحباً بك في صفحتي الشخصية الرسمية.</p>

        <div class="social-links">
            <!-- رابط التليجرام -->
            <a href="https://t.me/hatemalahlasi" target="_blank" class="social-btn">
                <div class="left-side">
                    <i class="fa-brands fa-telegram"></i>
                    <span>تليجرام</span>
                </div>
                <i class="fa-solid fa-chevron-left" style="font-size: 11px; color: var(--text-muted);"></i>
            </a>

            <!-- رابط الانستقرام -->
            <a href="https://instagram.com" target="_blank" class="social-btn">
                <div class="left-side">
                    <i class="fa-brands fa-instagram"></i>
                    <span>انستقرام</span>
                </div>
                <i class="fa-solid fa-chevron-left" style="font-size: 11px; color: var(--text-muted);"></i>
            </a>

            <!-- رابط الفيسبوك -->
            <a href="https://facebook.com" target="_blank" class="social-btn">
                <div class="left-side">
                    <i class="fa-brands fa-facebook"></i>
                    <span>فيسبوك</span>
                </div>
                <i class="fa-solid fa-chevron-left" style="font-size: 11px; color: var(--text-muted);"></i>
            </a>
        </div>

        <div class="footer-note">
            جميع الحقوق محفوظة © 2026 حاتم الأحلصي
        </div>
    </div>

</body>
</html>
